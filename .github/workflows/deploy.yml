name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-be
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Pull và build lại BE
        run: |
          set -e
          cd "$HOME/smr"
          git -C BE-Java pull --ff-only
          docker compose up -d --build smr-backend

      - name: Chờ BE healthy
        run: |
          for i in $(seq 1 36); do
            s=$(docker inspect -f '{{.State.Health.Status}}' smr-backend)
            if [ "$s" = "healthy" ]; then echo "BE healthy"; exit 0; fi
            sleep 5
          done
          docker logs --tail 60 smr-backend
          exit 1

      - name: Dọn image cũ
        run: docker image prune -f
