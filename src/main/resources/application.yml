spring:
  application:
    name: smr-backend
  config:
    # Cấu hình riêng máy dev (DB qua SSH tunnel...). File đã nằm trong .gitignore và .dockerignore;
    # không có file thì bỏ qua. Biến môi trường vẫn ghi đè giá trị trong file này.
    import: "optional:classpath:application-local.yml"
  datasource:
    # Mặc định = DB trên server qua SSH tunnel: ssh -N -L 1433:127.0.0.1:1433 -p 23456 duyvb@112.137.129.168
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=KLTNSMR;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:KLTN_SMR_2026}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  servlet:
    multipart:
      # Mặc định Spring chỉ cho 1MB → tài liệu và bản ghi hình bị từ chối. Khớp nginx (client_max_body_size 210m).
      max-file-size: 210MB
      max-request-size: 210MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        use_nationalized_character_data: true

server:
  port: ${SERVER_PORT:4558}

smr:
  jwt:
    key: ${JWT_KEY:SMR-Development-Only-Key-Change-Before-Production-2026}
    issuer: ${JWT_ISSUER:SMR.Api}
    audience: ${JWT_AUDIENCE:SMR.Web}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRES_MINUTES:1440}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRES_DAYS:7}
    reset-token-expiration-minutes: ${JWT_RESET_EXPIRES_MINUTES:15}
  auth:
    public-registration: ${PUBLIC_REGISTRATION:false}
    registration-org-id: ${REGISTRATION_ORG_ID:}
    registration-title-code: ${REGISTRATION_TITLE_CODE:}
    expose-reset-token: ${EXPOSE_RESET_TOKEN:false}
  cors:
    # Địa chỉ trang FE được gọi BE (dạng mẫu). ":[*]" = mọi cổng, kể cả cổng mặc định 80/443 (trình duyệt không gửi cổng);
    # ":*" thì KHÔNG khớp khi trang chạy ở cổng mặc định. "*." = mọi tên miền con.
    # Biến CORS_ALLOWED_ORIGINS hoặc tham số --smr.cors.allowed-origins=... sẽ THAY THẾ toàn bộ danh sách này.
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],https://kltn-smr.duckdns.org}"
  minio:
    endpoint: ${MINIO_ENDPOINT:minio.d2s.vn}
    port: ${MINIO_PORT:443}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:admin123}
    use-ssl: ${MINIO_USE_SSL:true}
    bucket-name: ${MINIO_BUCKET:kltn}  # S3: tên bucket phải viết thường
  jitsi:
    domain: ${JITSI_DOMAIN:meet.d2s.vn}
    app-id: ${JITSI_APP_ID:smr}
    external-api-url: ${JITSI_EXTERNAL_API_URL:https://meet.d2s.vn/external_api.js}
  llm:
    url: ${LLM_URL:https://llm.d2s.vn/v1/chat/completions}
    api-key: ${LLM_API_KEY:d2s_llm_test}
    model: ${LLM_MODEL:default}
    bypass-auth: ${LLM_BYPASS_AUTH:true}
    system-prompt: ${LLM_SYSTEM_PROMPT:Bạn là AI của hệ thống SMR hỗ trợ người dùng về mọi thứ liên quan đến cuộc họp}
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:5000}
    # 120 giây: tổng hợp biên bản theo mẫu (P13) trả lời dài hơn hỏi đáp thông thường.
    read-timeout-ms: ${LLM_READ_TIMEOUT_MS:120000}

